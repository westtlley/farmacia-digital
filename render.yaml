services:
  # Backend API (Render)
  - type: web
    name: farmacia-digital-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node scripts/seed-admin.js && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: true
      - key: DATABASE_SSL_REJECT_UNAUTHORIZED
        value: false
      - key: AUTH_SESSION_TTL_HOURS
        value: 24
      - key: AUTH_COOKIE_NAME
        value: farmacia_session
      - key: AUTH_COOKIE_SECURE
        value: true
      - key: AUTH_COOKIE_SAME_SITE
        value: none
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_PROVIDER
        value: s3
      - key: STORAGE_S3_BUCKET
        sync: false
      - key: STORAGE_S3_REGION
        sync: false
      - key: STORAGE_S3_ENDPOINT
        sync: false
      - key: STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: STORAGE_S3_FORCE_PATH_STYLE
        value: false
      - key: REDIS_URL
        sync: false
      - key: REDIS_RETRY_AFTER_FAILURE_MS
        value: 15000
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: production
      - key: SENTRY_RELEASE
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: 0
      - key: LOG_HTTP_REQUESTS
        value: false
      - key: ENABLE_API_CSP
        value: true
      - key: MAX_PRESCRIPTION_UPLOAD_BYTES
        value: 10485760
      - key: RATE_LIMIT_LOGIN_WINDOW_MS
        value: 300000
      - key: RATE_LIMIT_LOGIN_MAX
        value: 5
      - key: RATE_LIMIT_PRESCRIPTION_UPLOAD_WINDOW_MS
        value: 600000
      - key: RATE_LIMIT_PRESCRIPTION_UPLOAD_MAX
        value: 8
      - key: RATE_LIMIT_ORDER_WINDOW_MS
        value: 300000
      - key: RATE_LIMIT_ORDER_MAX
        value: 12
      - key: RATE_LIMIT_ADMIN_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_ADMIN_MAX
        value: 60
      - key: AUTH_COOKIE_DOMAIN
        sync: false
